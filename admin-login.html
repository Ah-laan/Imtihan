<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Barey Exam Portal</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><div class="auth-card"><a class="back" href="index.html">← Back</a><div class="auth-icon">🔐</div><h1>Admin / Teacher Login</h1><p>Only authorized admin/teacher users can manage and import exams.</p><form id="f"><label>Username<input id="u" required></label><label>Password<input id="p" type="password" required></label><div id="e" class="alert error hidden"></div><button class="btn primary full">Login</button></form><div class="demo-box"><b>Demo admin</b><br>Username: admin<br>Password: admin123</div></div><script>f.onsubmit=e=>{e.preventDefault();if(u.value==='admin'&&p.value==='admin123'){sessionStorage.setItem('barey_admin','true');location.href='admin.html'}else{document.getElementById('e').textContent='Invalid admin username or password.';document.getElementById('e').classList.remove('hidden')}}</script></body></html>
